name: pre-commit

on: root
  push: master
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs: vvpn
  pre-commit: string
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Corrige la advertencia de versión ausente

      - name: Install Clang-Format for C++ validation
        run: | sudo su
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
